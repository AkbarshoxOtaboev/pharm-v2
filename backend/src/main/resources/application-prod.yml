# Qiymatlar ish papkasidagi .env fayldan olinadi.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ms: ${JWT_ACCESS_MS:900000}
    refresh-token-ms: ${JWT_REFRESH_MS:604800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080}
  storage:
    uploads-location: ${UPLOAD_DIR:uploads}
    temp-location: ${TEMP_DIR:temp}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrator}

logging:
  level:
    uz.uwon.pharm: INFO
    org.springframework.security: WARN
