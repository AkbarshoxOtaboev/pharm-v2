spring:
  application:
    name: pharm-api
  profiles:
    active: dev

app:
  jwt:
    secret: ${JWT_SECRET:pharm-v2-dev-secret-key-change-in-production-32chars}
    access-token-ms: 86400000
    refresh-token-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage:
    uploads-location: ${UPLOAD_DIR:uploads}
    temp-location: ${TEMP_DIR:temp}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
